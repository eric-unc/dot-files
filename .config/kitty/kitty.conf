# BEGIN_KITTY_THEME
# Solarized Light
include current-theme.conf
# END_KITTY_THEME

# bell: no beep, but mark the tab so long builds are visible
enable_audio_bell no
window_alert_on_bell yes

# desktop notification when a slow command finishes in a window you can't see
notify_on_cmd_finish invisible 10.0

# selection goes straight to the clipboard (pairs with the `c` alias)
# note: inside tmux, hold Shift to bypass tmux's mouse grab
copy_on_select clipboard
strip_trailing_spaces smart

# scrollback (applies to non-tmux windows; tmux owns its own history)
scrollback_lines 100000
scrollback_pager_history_size 4

window_padding_width 4
modify_font cell_height 105%

detect_urls yes
select_by_word_characters @-./_~?&=%+#
